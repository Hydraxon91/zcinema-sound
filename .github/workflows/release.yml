name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src-app/ZCinemaSound.Tests --nologo

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Prefer the pushed tag (v0.1.3 -> 0.1.3); fall back to the csproj for manual runs.
          $ver = '${{ github.ref_name }}' -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            [xml]$csproj = Get-Content -Raw 'src-app/ZCinemaSound.App/ZCinemaSound.App.csproj'
            $ver = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $ver"

      - name: Publish (self-contained, single-file) — full installer
        run: >
          dotnet publish src-app/ZCinemaSound.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/full

      - name: Publish (framework-dependent, single-file) — lite installer
        run: >
          dotnet publish src-app/ZCinemaSound.App -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/lite

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installers
        shell: pwsh
        run: |
          $full = Join-Path $env:GITHUB_WORKSPACE 'artifacts\full'
          $lite = Join-Path $env:GITHUB_WORKSPACE 'artifacts\lite'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppExeDir=$full" "/DVersion=${{ steps.ver.outputs.version }}" 'installer\zcinema.iss'
          if ($LASTEXITCODE -ne 0) { throw 'full installer build failed' }
          & $iscc "/DAppExeDir=$lite" "/DVersion=${{ steps.ver.outputs.version }}" '/DOutputBaseFilename=ZCinemaSound-Setup-lite' '/DFrameworkDependent=1' 'installer\zcinema.iss'
          if ($LASTEXITCODE -ne 0) { throw 'lite installer build failed' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZCinemaSound
          path: |
            artifacts/full/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
            installer/output/ZCinemaSound-Setup-lite.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/full/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
            installer/output/ZCinemaSound-Setup-lite.exe
