name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src-app/ZCinemaSound.Tests --nologo

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Prefer the pushed tag (v0.1.3 -> 0.1.3); fall back to the csproj for manual runs.
          $ver = '${{ github.ref_name }}' -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            [xml]$csproj = Get-Content -Raw 'src-app/ZCinemaSound.App/ZCinemaSound.App.csproj'
            $ver = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $ver"

      - name: Publish (self-contained, single-file) — full installer
        run: >
          dotnet publish src-app/ZCinemaSound.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/full

      - name: Publish (framework-dependent, single-file) — lite installer
        run: >
          dotnet publish src-app/ZCinemaSound.App -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o artifacts/lite

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installers
        shell: pwsh
        run: |
          $full = Join-Path $env:GITHUB_WORKSPACE 'artifacts\full'
          $lite = Join-Path $env:GITHUB_WORKSPACE 'artifacts\lite'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppExeDir=$full" "/DVersion=${{ steps.ver.outputs.version }}" 'installer\zcinema.iss'
          if ($LASTEXITCODE -ne 0) { throw 'full installer build failed' }
          & $iscc "/DAppExeDir=$lite" "/DVersion=${{ steps.ver.outputs.version }}" '/DOutputBaseFilename=ZCinemaSound-Setup-lite' '/DFrameworkDependent=1' 'installer\zcinema.iss'
          if ($LASTEXITCODE -ne 0) { throw 'lite installer build failed' }

      - name: Upload unsigned (for signing)
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: |
            artifacts/full/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
            installer/output/ZCinemaSound-Setup-lite.exe

      # Staged but inert until configured. See docs/SIGNING.md. Set the repo
      # variable SIGNPATH_ORG_ID (and the others) + the SIGNPATH_API_TOKEN secret
      # to activate — until then this and the next step are skipped.
      - name: Sign with SignPath (optional)
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-name-unsigned: unsigned
          github-artifact-name-signed: signed
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed files (when signed)
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        shell: pwsh
        run: |
          if (Test-Path 'signed/ZCinemaSound.App.exe')          { Copy-Item 'signed/ZCinemaSound.App.exe'          'artifacts/full/ZCinemaSound.App.exe' -Force }
          if (Test-Path 'signed/ZCinemaSound-Setup.exe')        { Copy-Item 'signed/ZCinemaSound-Setup.exe'        'installer/output/ZCinemaSound-Setup.exe' -Force }
          if (Test-Path 'signed/ZCinemaSound-Setup-lite.exe')   { Copy-Item 'signed/ZCinemaSound-Setup-lite.exe'   'installer/output/ZCinemaSound-Setup-lite.exe' -Force }
          Write-Host "Signed artifacts staged."

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZCinemaSound
          path: |
            artifacts/full/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
            installer/output/ZCinemaSound-Setup-lite.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/full/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
            installer/output/ZCinemaSound-Setup-lite.exe
