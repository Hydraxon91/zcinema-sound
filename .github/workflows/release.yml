name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src-app/ZCinemaSound.Tests --nologo

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Prefer the pushed tag (v0.1.1 -> 0.1.1); fall back to the csproj for manual runs.
          $ver = '${{ github.ref_name }}' -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            [xml]$csproj = Get-Content -Raw 'src-app/ZCinemaSound.App/ZCinemaSound.App.csproj'
            $ver = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $ver"

      - name: Publish app (single-file, self-contained)
        run: >
          dotnet publish src-app/ZCinemaSound.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'src-app\ZCinemaSound.App\bin\Release\net10.0-windows\win-x64\publish'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppExeDir=$pub" "/DVersion=${{ steps.ver.outputs.version }}" 'installer\zcinema.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCinemaSound
          path: |
            src-app/ZCinemaSound.App/bin/Release/net10.0-windows/win-x64/publish/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-app/ZCinemaSound.App/bin/Release/net10.0-windows/win-x64/publish/ZCinemaSound.App.exe
            installer/output/ZCinemaSound-Setup.exe
